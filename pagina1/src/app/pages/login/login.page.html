<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">login</ion-title>
    </ion-toolbar>
  </ion-header>


<ion-input label="Usuario" label-placement="floating" fill="solid" placeholder="Escriba aqui" [(ngModel)]="usuario"></ion-input>

<br />

<ion-input label="Contraseña" label-placement="floating" fill="outline" placeholder="Escriba aqui" [(ngModel)]="contrasena"></ion-input>

<ion-button [routerLink]="['/listacomidas']">Iniciar sesión</ion-button>
<ion-button [routerLink]="['/registro']" fill="outline">Registrarse</ion-button>
<mat-spinner></mat-spinner>

</ion-content>
